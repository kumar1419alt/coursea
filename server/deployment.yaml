apiVersion: v1
kind: ConfigMap
metadata:
  name: bestcars-config
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "*"
  BACKEND_URL: "http://dealer-api:3030"
  SENTIMENT_ANALYZER_URL: "http://sentiment:5050"
  PORT: "3030"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-db
  template:
    metadata:
      labels:
        app: mongo-db
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-db
spec:
  selector:
    app: mongo-db
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealer-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealer-api
  template:
    metadata:
      labels:
        app: dealer-api
    spec:
      containers:
        - name: dealer-api
          image: us.icr.io/REPLACE_WITH_ICR_NAMESPACE/bestcars-dealer-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3030
          env:
            - name: PORT
              value: "3030"
            - name: MONGO_URL
              value: mongodb://mongo-db:27017/dealershipsDB
          readinessProbe:
            httpGet:
              path: /health
              port: 3030
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dealer-api
spec:
  selector:
    app: dealer-api
  ports:
    - port: 3030
      targetPort: 3030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment
  template:
    metadata:
      labels:
        app: sentiment
    spec:
      containers:
        - name: sentiment
          image: us.icr.io/REPLACE_WITH_ICR_NAMESPACE/bestcars-sentiment:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
          env:
            - name: PORT
              value: "5050"
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment
spec:
  selector:
    app: sentiment
  ports:
    - port: 5050
      targetPort: 5050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bestcars-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bestcars-web
  template:
    metadata:
      labels:
        app: bestcars-web
    spec:
      containers:
        - name: web
          image: us.icr.io/REPLACE_WITH_ICR_NAMESPACE/bestcars-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bestcars-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bestcars-secret
                  key: DJANGO_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /djangoapp/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bestcars-web
spec:
  type: LoadBalancer
  selector:
    app: bestcars-web
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
