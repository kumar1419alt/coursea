services:
  mongo_db:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      PORT: 3030
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
    ports:
      - "3030:3030"
    depends_on:
      mongo_db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mongo_data:
