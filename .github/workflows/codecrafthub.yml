name: CodeCraftHub validation

on:
  push:
    branches:
      - codecrafthub-project
    paths:
      - "codecrafthub/**"
      - ".github/workflows/codecrafthub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-codecrafthub:
    name: Validate API and dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codecrafthub
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codecrafthub/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check backend JavaScript syntax
        run: node --check server.js

      - name: Check embedded dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one embedded script, found {len(scripts)}")
          pathlib.Path("/tmp/codecrafthub-dashboard.js").write_text(scripts[0], encoding="utf-8")
          print("Found one embedded dashboard script.")
          PY
          node --check /tmp/codecrafthub-dashboard.js

      - name: Start the API
        run: |
          PORT=3127 npm start > /tmp/codecrafthub-server.log 2>&1 &
          echo $! > /tmp/codecrafthub-server.pid
          for attempt in $(seq 1 15); do
            if curl --silent --fail http://127.0.0.1:3127/health >/tmp/codecrafthub-health.json; then
              cat /tmp/codecrafthub-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/codecrafthub-server.log
          exit 1

      - name: Smoke-test course CRUD and validation
        run: |
          set -euo pipefail

          curl --silent --show-error --fail http://127.0.0.1:3127/api/courses >/tmp/codecrafthub-list.json
          node -e 'const r=require("/tmp/codecrafthub-list.json"); if(!r.success || !Array.isArray(r.data) || r.data.length < 1) process.exit(1); console.log("GET list: OK ("+r.data.length+" seeded courses)")'

          create_status=$(curl --silent --show-error -o /tmp/codecrafthub-created.json -w "%{http_code}" -X POST http://127.0.0.1:3127/api/courses -H "Content-Type: application/json" -d '{"title":"CI Smoke Course","instructor":"CI Runner","category":"Testing","level":"beginner","status":"draft","duration":"1 hour","description":"Temporary test record"}')
          test "$create_status" = "201"
          node -e 'const r=require("/tmp/codecrafthub-created.json"); if(!r.success || !r.data.id) process.exit(1); process.stdout.write(r.data.id)' >/tmp/codecrafthub-id
          course_id=$(cat /tmp/codecrafthub-id)
          echo "POST create: HTTP $create_status"

          curl --silent --show-error --fail "http://127.0.0.1:3127/api/courses/$course_id" >/tmp/codecrafthub-read.json
          node -e 'const r=require("/tmp/codecrafthub-read.json"); if(!r.success || r.data.title!=="CI Smoke Course") process.exit(1); console.log("GET by ID: OK")'

          update_status=$(curl --silent --show-error -o /tmp/codecrafthub-updated.json -w "%{http_code}" -X PUT "http://127.0.0.1:3127/api/courses/$course_id" -H "Content-Type: application/json" -d '{"title":"CI Smoke Course Updated","instructor":"CI Runner","category":"Testing","level":"intermediate","status":"published","duration":"2 hours","description":"Updated temporary test record"}')
          test "$update_status" = "200"
          node -e 'const r=require("/tmp/codecrafthub-updated.json"); if(!r.success || r.data.title!=="CI Smoke Course Updated" || r.data.status!=="published") process.exit(1); console.log("PUT update: HTTP 200")'

          delete_status=$(curl --silent --show-error -o /tmp/codecrafthub-deleted.json -w "%{http_code}" -X DELETE "http://127.0.0.1:3127/api/courses/$course_id")
          test "$delete_status" = "200"
          node -e 'const r=require("/tmp/codecrafthub-deleted.json"); if(!r.success) process.exit(1); console.log("DELETE: HTTP 200")'

          missing_status=$(curl --silent --show-error -o /tmp/codecrafthub-missing.json -w "%{http_code}" "http://127.0.0.1:3127/api/courses/$course_id")
          test "$missing_status" = "404"
          echo "GET deleted ID: HTTP $missing_status"

          invalid_status=$(curl --silent --show-error -o /tmp/codecrafthub-invalid.json -w "%{http_code}" -X POST http://127.0.0.1:3127/api/courses -H "Content-Type: application/json" -d '{"title":"Bad Enum","instructor":"CI Runner","category":"Testing","level":"expert","status":"draft"}')
          test "$invalid_status" = "400"
          echo "Invalid enum validation: HTTP $invalid_status"

          curl --silent --show-error --fail "http://127.0.0.1:3127/api/courses?search=javascript" >/tmp/codecrafthub-search.json
          node -e 'const r=require("/tmp/codecrafthub-search.json"); if(!r.success || !r.data.some(c=>c.title.toLowerCase().includes("javascript"))) process.exit(1); console.log("Search filter: OK")'

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/codecrafthub-server.pid ]; then
            kill "$(cat /tmp/codecrafthub-server.pid)" 2>/dev/null || true
          fi
