name: Best Cars CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Lint Python source
        run: ruff check --select E4,E7,E9,F63,F7,F82 server/djangoapp server/djangoproj

  lint-javascript:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ESLint static checks
        run: |
          npx --yes eslint@8.57.1 --no-eslintrc --env node,browser --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' --rule 'no-unreachable:error' --rule 'no-constant-condition:error' --rule 'no-dupe-keys:error' server/database/app.js server/database/dealership.js server/database/review.js server/database/inventory.js server/frontend/src/App.js server/frontend/src/components/Register/Register.jsx

  validate:
    if: github.actor != 'github-actions[bot]'
    name: Validate application
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/djangoapp/microservices/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r server/djangoapp/microservices/requirements.txt

      - name: Compile Python and test sentiment endpoint
        run: |
          python -m compileall -q server/djangoapp server/djangoproj
          cd server/djangoapp/microservices
          python -m unittest test_app.py

      - name: Validate dealer API JavaScript and seed JSON
        run: |
          node --check server/database/app.js
          node --check server/database/dealership.js
          node --check server/database/review.js
          node --check server/database/inventory.js
          node -e 'for (const f of process.argv.slice(1)) JSON.parse(require("fs").readFileSync(f, "utf8"))' server/database/data/dealerships.json server/database/data/reviews.json server/database/data/car_records.json

      - name: Install frontend dependencies and build React
        working-directory: server/frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Check Django configuration
        working-directory: server
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "true"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          BACKEND_URL: http://127.0.0.1:3030
          SENTIMENT_ANALYZER_URL: http://127.0.0.1:5050
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Install Playwright and desktop screenshot utility
        if: github.event_name == 'push' && github.ref == 'refs/heads/django-dealership-capstone'
        run: |
          npm --prefix server/frontend install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          server/frontend/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y scrot

      - name: Start services and capture real cURL evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/django-dealership-capstone'
        env:
          DJANGO_SECRET_KEY: ci-only-test-secret
          DJANGO_DEBUG: "true"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          BACKEND_URL: http://127.0.0.1:3030
          SENTIMENT_ANALYZER_URL: http://127.0.0.1:5050
          PYTHONUNBUFFERED: "1"
          MONGO_URL: mongodb://127.0.0.1:27017/dealershipsDB
        run: |
          set -euo pipefail
          npm --prefix server/database install --no-audit --no-fund

          (cd server/djangoapp/microservices && PORT=5050 python app.py) >/tmp/bestcars-sentiment.log 2>&1 &
          sentiment_pid=$!
          MONGO_URL="$MONGO_URL" PORT=3030 node server/database/app.js >/tmp/bestcars-dealer-api.log 2>&1 &
          dealer_pid=$!

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5050/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5050/health

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3030/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3030/health

          (
            cd server
            python manage.py migrate --noinput
          )

          export DEMO_USERNAME="capstone-demo"
          export DEMO_PASSWORD="CiEvidencePass123!"
          echo "::add-mask::$DEMO_PASSWORD"
          (
            cd server
            python manage.py shell -c 'import os; from django.contrib.auth import get_user_model; User = get_user_model(); user, _ = User.objects.get_or_create(username="capstone-demo", defaults={"email":"capstone-demo@example.test"}); user.set_password(os.environ["DEMO_PASSWORD"]); user.save()'
          )

          export ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$ADMIN_PASSWORD"
          (
            cd server
            python manage.py shell -c 'import os; from django.contrib.auth import get_user_model; User = get_user_model(); user, _ = User.objects.get_or_create(username="root", defaults={"email":"root@example.test"}); user.is_staff = True; user.is_superuser = True; user.set_password(os.environ["ADMIN_PASSWORD"]); user.save()'
          )

          (
            cd server
            python manage.py runserver 0.0.0.0:8000 --noreload
          ) >/tmp/bestcars-django-server.log 2>&1 &
          django_pid=$!

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/djangoapp/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/djangoapp/health

          BASE_URL=http://127.0.0.1:8000 \
          DEALER_API_URL=http://127.0.0.1:3030 \
          SENTIMENT_URL=http://127.0.0.1:5050 \
          bash scripts/capture-api-evidence.sh

          NODE_PATH="$GITHUB_WORKSPACE/server/frontend/node_modules" \
          BASE_URL=http://127.0.0.1:8000 \
          DEMO_USERNAME="$DEMO_USERNAME" \
          DEMO_PASSWORD="$DEMO_PASSWORD" \
          ADMIN_PASSWORD="$ADMIN_PASSWORD" \
          xvfb-run -a -s "-screen 0 1600x1100x24" node scripts/capture-ui-screenshots.js

          {
            printf '$ cd server && python manage.py runserver 0.0.0.0:8000 --noreload\n\n'
            cat /tmp/bestcars-django-server.log
            printf '\n$ curl -fsS http://127.0.0.1:8000/djangoapp/health\n'
            curl -fsS http://127.0.0.1:8000/djangoapp/health
            printf '\n'
          } > django_server

          echo "Live API evidence files generated in this CI run."
          echo "Process IDs: Django=$django_pid DealerAPI=$dealer_pid Sentiment=$sentiment_pid"

      - name: Commit live cURL evidence to this branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/django-dealership-capstone'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add django_server loginuser logoutuser getdealerreviews getalldealers getdealerbyid getdealersbyState getallcarmakes analyzereview admin_login.png admin_logout.png get_dealers.png get_dealers_loggedin.png dealersbystate.png dealer_id_reviews.png dealership_review_submission.png added_review.png
          if git diff --cached --quiet; then
            echo "No new API evidence changes to commit."
            exit 0
          fi
          git commit -m "Capture live API and browser evidence from CI [skip ci]"
          git push origin HEAD:refs/heads/django-dealership-capstone
